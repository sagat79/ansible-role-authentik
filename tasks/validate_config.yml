---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "authentik_config_redis_hostname", "new": "<removed>" }
    - { "old": "authentik_config_redis_port", "new": "<removed>" }
    - { "old": "authentik_config_redis_database", "new": "<removed>" }
    - { "old": "authentik_config_redis_url", "new": "<removed>" }
    - { "old": "authentik_env_path", "new": "<Removed>" }
    - { "old": "authentik_environment_variables_extension", "new": "authentik_environment_variables_additional_variables" }
    - { "old": "authentik_server_container_additional_networks_custom", "new": "authentik_container_additional_networks_custom" }
    - { "old": "authentik_server_http_header_content_permission_policy", "new": "authentik_server_http_header_permissions_policy" }
    - { "old": "authentik_redis_hostname", "new": "<removed>" }
    - { "old": "authentik_redis_port", "new": "<removed>" }
    - { "old": "authentik_redis_database", "new": "<removed>" }
    - { "old": "authentik_redis_url", "new": "<removed>" }
    - { "old": "authentik_custon_templates_path", "new": "authentik_custom_templates_path" }
    - { "old": "authentik_media_path", "new": "<removed. Use authentik_data_path>" }
    - { "old": "authentik_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required authentik settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - authentik_uid
    - authentik_gid
    - authentik_hostname
    - authentik_path_prefix
    - authentik_container_network
    - authentik_database_hostname
    - authentik_database_username
    - authentik_database_password
    - authentik_secret_key

- name: Fail if authentik_path_prefix ends with a slash
  ansible.builtin.fail:
    msg: >-
      authentik_path_prefix (`{{ authentik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/authentik`).
  when: "authentik_path_prefix != '/' and authentik_path_prefix[-1] == '/'"

- name: Fail if authentik_loglevel is invalid
  ansible.builtin.fail:
    msg: >-
      authentik_loglevel (`{{ authentik_loglevel }}`) must be one of: debug, info, warning, error, critical.
  when: "authentik_loglevel not in ['debug', 'info', 'warning', 'error', 'critical']"

- name: Fail if authentik_storage_backend is invalid
  ansible.builtin.fail:
    msg: >-
      authentik_storage_backend (`{{ authentik_storage_backend }}`) must be either `file` or `s3`.
  when: "authentik_storage_backend not in ['file', 's3']"

- name: Fail if S3 storage is enabled without a bucket name
  ansible.builtin.fail:
    msg: >-
      You need to define `authentik_storage_s3_bucket_name` when `authentik_storage_backend` is `s3`.
  when: "authentik_storage_backend == 's3' and authentik_storage_s3_bucket_name == ''"

- name: Fail if both authentik_bootstrap_password and authentik_bootstrap_password_hash are defined
  ansible.builtin.fail:
    msg: >-
      `authentik_bootstrap_password` and `authentik_bootstrap_password_hash` are mutually exclusive. Define only one of them.
  when: "authentik_bootstrap_password != '' and authentik_bootstrap_password_hash != ''"

- name: Fail if an enabled authentik outpost has no token defined
  ansible.builtin.fail:
    msg: >-
      You need to define `authentik_outpost_{{ item.type }}_token` to run the {{ item.type | upper }} outpost.
      Create an outpost in the authentik admin interface (Applications -> Outposts)
      and copy its token from `View Deployment Info`.
  when: "item.enabled | bool and item.token == ''"
  with_items: "{{ authentik_outposts_definitions }}"
  loop_control:
    label: "{{ item.type }}"

- name: Fail if SMTP settings are missing (and SMTP is enabled by setting host)
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) to correctly set up email via SMTP.
  when: "authentik_email_host !='' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - authentik_email_port

- name: Run if Traefik is enabled
  when: authentik_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for authentik are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - authentik_container_labels_traefik_hostname
        - authentik_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `authentik_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if authentik_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          authentik_container_labels_traefik_path_prefix (`{{ authentik_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/authentik`).
      when: "authentik_container_labels_traefik_path_prefix != '/' and authentik_container_labels_traefik_path_prefix[-1] == '/'"

    # The request is passed to authentik with the path prefix intact and authentik
    # is configured for subpath serving via `AUTHENTIK_WEB__PATH` (derived from
    # `authentik_path_prefix`), so the Traefik routing prefix must match it.
    - name: Fail if authentik_container_labels_traefik_path_prefix does not match authentik_path_prefix
      ansible.builtin.fail:
        msg: >-
          authentik_container_labels_traefik_path_prefix (`{{ authentik_container_labels_traefik_path_prefix }}`)
          must be equal to authentik_path_prefix (`{{ authentik_path_prefix }}`).
          The role derives authentik's own subpath configuration (`AUTHENTIK_WEB__PATH`) from `authentik_path_prefix`,
          so override `authentik_path_prefix` instead of overriding the Traefik path prefix separately.
      when: "authentik_container_labels_traefik_path_prefix != authentik_path_prefix"
